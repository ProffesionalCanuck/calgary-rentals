<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Reminders</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F7A52">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #F2F5F1;
    --card: #FFFFFF;
    --ink: #20281F;
    --ink-dim: #66705F;
    --line: #DFE5DA;
    --accent: #2F7A52;
    --accent-ink: #FFFFFF;
    --overdue: #B5443B;
    --soon: #9A6B1D;
    --done: #8A947F;
    --shadow: 0 1px 3px rgba(32, 40, 31, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151A16;
      --card: #1F2620;
      --ink: #E7ECE4;
      --ink-dim: #98A392;
      --line: #2E372F;
      --accent: #63C08E;
      --accent-ink: #0E1511;
      --overdue: #F08A7E;
      --soon: #E0B061;
      --done: #6C7866;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #F2F5F1; --card: #FFFFFF; --ink: #20281F; --ink-dim: #66705F;
    --line: #DFE5DA; --accent: #2F7A52; --accent-ink: #FFFFFF;
    --overdue: #B5443B; --soon: #9A6B1D; --done: #8A947F;
    --shadow: 0 1px 3px rgba(32, 40, 31, 0.08);
  }
  :root[data-theme="dark"] {
    --bg: #151A16; --card: #1F2620; --ink: #E7ECE4; --ink-dim: #98A392;
    --line: #2E372F; --accent: #63C08E; --accent-ink: #0E1511;
    --overdue: #F08A7E; --soon: #E0B061; --done: #6C7866;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    padding: 0 1rem 4rem;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 30rem; margin: 0 auto; }

  header { padding: 1.4rem 0 0.4rem; }
  header h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }
  header .today {
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin-top: 0.15rem;
  }

  .notify-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.75rem 0.9rem;
    margin: 0.9rem 0;
    box-shadow: var(--shadow);
  }
  .notify-bar p { margin: 0; font-size: 0.88rem; color: var(--ink-dim); flex: 1; }
  .notify-bar.hidden { display: none; }

  button {
    font: inherit;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    min-height: 44px;
  }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-accent {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    padding: 0.55rem 1.1rem;
    white-space: nowrap;
  }
  .btn-quiet {
    background: none;
    color: var(--ink-dim);
    padding: 0.4rem 0.6rem;
    min-height: 36px;
    font-size: 0.85rem;
  }

  form.add {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1.6rem;
    box-shadow: var(--shadow);
    display: grid;
    gap: 0.7rem;
  }
  form.add input[type="text"],
  form.add input[type="date"],
  form.add input[type="time"],
  form.add select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem 0.7rem;
    width: 100%;
    min-height: 48px;
  }
  form.add .row { display: flex; gap: 0.7rem; }
  form.add .row > * { flex: 1; min-width: 0; }
  form.add label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-dim);
    margin-bottom: 0.25rem;
  }
  form.add .submit { width: 100%; font-size: 1.05rem; min-height: 52px; }

  .group { margin-bottom: 1.5rem; }
  .group > h2 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-dim);
    margin: 0 0 0.5rem 0.2rem;
  }
  .group.overdue > h2 { color: var(--overdue); }
  .group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.8rem 0.9rem;
    box-shadow: var(--shadow);
  }
  li.task.is-overdue { border-color: color-mix(in srgb, var(--overdue) 45%, var(--line)); }
  li.task .check {
    flex: none;
    width: 30px;
    height: 30px;
    margin-top: 0.1rem;
    border-radius: 50%;
    border: 2px solid var(--ink-dim);
    background: none;
    min-height: 30px;
    display: grid;
    place-items: center;
    color: transparent;
    font-size: 1rem;
  }
  li.task.is-done .check {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }
  li.task .body { flex: 1; min-width: 0; }
  li.task .title { font-weight: 600; overflow-wrap: break-word; }
  li.task.is-done .title { text-decoration: line-through; color: var(--done); font-weight: 500; }
  li.task .when { font-size: 0.85rem; color: var(--ink-dim); margin-top: 0.1rem; }
  li.task.is-overdue .when { color: var(--overdue); font-weight: 600; }
  li.task .when .soon { color: var(--soon); font-weight: 600; }
  li.task .when .repeat { color: var(--ink-dim); font-weight: 400; }
  li.task .actions { display: flex; flex-direction: column; gap: 0.15rem; align-items: flex-end; }

  .empty {
    text-align: center;
    color: var(--ink-dim);
    padding: 2.5rem 1rem;
    font-size: 0.95rem;
  }

  .banner {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%);
    width: min(92vw, 28rem);
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 14px;
    padding: 0.9rem 1.1rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    font-weight: 600;
    display: none;
    z-index: 10;
  }
  .banner.show { display: block; }
  @media (prefers-reduced-motion: no-preference) {
    .banner.show { animation: pop 0.25s ease-out; }
    @keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }
  }

  .strict-tag { color: var(--soon); font-weight: 600; }

  .alarm {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    padding: 2rem 1.5rem;
    background: #801E15;
    color: #FFF6F2;
    text-align: center;
  }
  .alarm.show { display: flex; }
  @media (prefers-reduced-motion: no-preference) {
    .alarm.show { animation: alarmPulse 1.6s ease-in-out infinite alternate; }
    @keyframes alarmPulse { from { background: #801E15; } to { background: #A62B1C; } }
  }
  .alarm .label {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    opacity: 0.85;
  }
  .alarm h2 {
    font-size: 2rem;
    margin: 0;
    line-height: 1.2;
    text-wrap: balance;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .alarm .due { font-size: 1.05rem; opacity: 0.9; }
  .alarm .hold {
    position: relative;
    overflow: hidden;
    width: min(100%, 22rem);
    min-height: 64px;
    background: #FFF6F2;
    color: #801E15;
    font-size: 1.15rem;
    font-weight: 700;
    border-radius: 14px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .alarm .hold .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: rgba(128, 30, 21, 0.25);
  }
  .alarm .hold .lbl { position: relative; }
  .alarm .snooze {
    background: none;
    border: 2px solid rgba(255, 246, 242, 0.7);
    color: #FFF6F2;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 12px;
  }
  .alarm .snooze:disabled { opacity: 0.4; cursor: default; }

  .done-tools { display: flex; justify-content: flex-end; margin-top: 0.4rem; }
  footer { margin-top: 2rem; text-align: center; color: var(--ink-dim); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My Reminders</h1>
    <div class="today" id="todayLine"></div>
  </header>

  <div class="notify-bar" id="notifyBar">
    <p>Turn on notifications so reminders can pop up on your phone.</p>
    <button class="btn-accent" id="notifyBtn" type="button">Turn on</button>
  </div>

  <form class="add" id="addForm">
    <div>
      <label for="taskTitle">What do you need to remember?</label>
      <input type="text" id="taskTitle" placeholder="e.g. Take out the recycling" autocomplete="off" maxlength="200">
    </div>
    <div class="row">
      <div>
        <label for="taskDate">Date</label>
        <input type="date" id="taskDate">
      </div>
      <div>
        <label for="taskTime">Time</label>
        <input type="time" id="taskTime">
      </div>
    </div>
    <div>
      <label for="taskRepeat">Repeat</label>
      <select id="taskRepeat">
        <option value="none">Doesn't repeat</option>
        <option value="daily">Every day</option>
        <option value="weekly">Every week</option>
        <option value="monthly">Every month</option>
      </select>
    </div>
    <div>
      <label for="taskStrict">How firm should it be?</label>
      <select id="taskStrict">
        <option value="normal">Normal — a notification</option>
        <option value="strict">Strict — full-screen alarm until I do it</option>
      </select>
    </div>
    <button class="btn-accent submit" type="submit">Add reminder</button>
  </form>

  <div id="lists"></div>

  <footer>Saved on this phone — works offline, no account needed.</footer>
</div>

<div class="banner" id="banner" role="status"></div>

<div class="alarm" id="alarm" role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle">
  <div class="label">Time to do this now</div>
  <h2 id="alarmTitle"></h2>
  <div class="due" id="alarmDue"></div>
  <button type="button" class="hold" id="alarmDone">
    <span class="fill" id="alarmFill"></span>
    <span class="lbl">Hold to mark done</span>
  </button>
  <button type="button" class="snooze" id="alarmSnooze">Snooze 5 minutes</button>
</div>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'myReminders.v1';
  var tasks = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save() {
    localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---------- Date helpers ----------
  function startOfDay(d) {
    var x = new Date(d); x.setHours(0, 0, 0, 0); return x;
  }
  function fmtTime(d) {
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function friendlyWhen(iso) {
    var d = new Date(iso);
    var now = new Date();
    var today = startOfDay(now).getTime();
    var that = startOfDay(d).getTime();
    var dayMs = 86400000;
    var dayLabel;
    if (that === today) dayLabel = 'Today';
    else if (that === today + dayMs) dayLabel = 'Tomorrow';
    else if (that === today - dayMs) dayLabel = 'Yesterday';
    else if (that > today && that < today + 7 * dayMs)
      dayLabel = d.toLocaleDateString([], { weekday: 'long' });
    else
      dayLabel = d.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
        (d.getFullYear() !== now.getFullYear() ? ', ' + d.getFullYear() : '');
    return dayLabel + ' ' + fmtTime(d);
  }
  function nextOccurrence(iso, repeat) {
    var d = new Date(iso);
    var now = new Date();
    do {
      if (repeat === 'daily') d.setDate(d.getDate() + 1);
      else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
      else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
      else return null;
    } while (d <= now);
    return d.toISOString();
  }
  var REPEAT_LABEL = { daily: 'repeats daily', weekly: 'repeats weekly', monthly: 'repeats monthly' };

  // ---------- Rendering ----------
  var listsEl = document.getElementById('lists');

  function render() {
    var now = Date.now();
    var groups = { overdue: [], today: [], upcoming: [], someday: [], done: [] };
    tasks.forEach(function (t) {
      if (t.done) { groups.done.push(t); return; }
      if (!t.due) { groups.someday.push(t); return; }
      var due = new Date(t.due).getTime();
      if (due <= now) groups.overdue.push(t);
      else if (startOfDay(new Date(t.due)).getTime() === startOfDay(new Date()).getTime()) groups.today.push(t);
      else groups.upcoming.push(t);
    });
    var byDue = function (a, b) { return new Date(a.due) - new Date(b.due); };
    groups.overdue.sort(byDue); groups.today.sort(byDue); groups.upcoming.sort(byDue);

    listsEl.innerHTML = '';
    var total = tasks.length;
    if (total === 0) {
      listsEl.innerHTML = '<div class="empty">Nothing here yet. Add your first reminder above 👆</div>';
      return;
    }
    renderGroup('Overdue', groups.overdue, 'overdue');
    renderGroup('Today', groups.today, 'today');
    renderGroup('Coming up', groups.upcoming, 'upcoming');
    renderGroup('No date', groups.someday, 'someday');
    renderGroup('Done', groups.done, 'done');
  }

  function renderGroup(label, items, kind) {
    if (!items.length) return;
    var section = document.createElement('section');
    section.className = 'group ' + kind;
    var h = document.createElement('h2');
    h.textContent = label + ' (' + items.length + ')';
    section.appendChild(h);
    var ul = document.createElement('ul');
    items.forEach(function (t) { ul.appendChild(renderTask(t, kind)); });
    section.appendChild(ul);
    if (kind === 'done') {
      var tools = document.createElement('div');
      tools.className = 'done-tools';
      var clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'btn-quiet';
      clear.textContent = 'Clear all done';
      clear.addEventListener('click', function () {
        tasks = tasks.filter(function (t) { return !t.done; });
        save(); render();
      });
      tools.appendChild(clear);
      section.appendChild(tools);
    }
    listsEl.appendChild(section);
  }

  function renderTask(t, kind) {
    var li = document.createElement('li');
    li.className = 'task' + (t.done ? ' is-done' : '') + (kind === 'overdue' ? ' is-overdue' : '');

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'check';
    check.textContent = '✓';
    check.setAttribute('aria-label', t.done ? 'Mark "' + t.title + '" as not done' : 'Mark "' + t.title + '" as done');
    check.addEventListener('click', function () { toggleDone(t.id); });
    li.appendChild(check);

    var body = document.createElement('div');
    body.className = 'body';
    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = t.title;
    body.appendChild(title);
    var when = document.createElement('div');
    when.className = 'when';
    var bits = [];
    if (t.due) bits.push(friendlyWhen(t.due));
    if (t.repeat && t.repeat !== 'none') bits.push('<span class="repeat">· ' + REPEAT_LABEL[t.repeat] + '</span>');
    if (t.strict && !t.done) bits.push('<span class="strict-tag">· 🔒 strict</span>');
    when.innerHTML = bits.join(' ');
    if (bits.length) body.appendChild(when);
    li.appendChild(body);

    var actions = document.createElement('div');
    actions.className = 'actions';
    if (kind === 'overdue') {
      var snooze = document.createElement('button');
      snooze.type = 'button';
      snooze.className = 'btn-quiet';
      snooze.textContent = '+10 min';
      snooze.addEventListener('click', function () { snoozeTask(t.id, 10); });
      actions.appendChild(snooze);
    }
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-quiet';
    del.textContent = 'Delete';
    del.addEventListener('click', function () {
      tasks = tasks.filter(function (x) { return x.id !== t.id; });
      save(); render();
    });
    actions.appendChild(del);
    li.appendChild(actions);
    return li;
  }

  // ---------- Task operations ----------
  function toggleDone(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    if (!t.done && t.repeat && t.repeat !== 'none' && t.due) {
      // Completing a repeating task rolls it forward instead of finishing it.
      var next = nextOccurrence(t.due, t.repeat);
      if (next) {
        t.due = next;
        t.notified = false;
        t.snoozesLeft = 3;
        t.lastNag = 0;
        save(); render();
        showBanner('Done! Next one: ' + friendlyWhen(next));
        return;
      }
    }
    t.done = !t.done;
    if (!t.done) { t.notified = false; t.snoozesLeft = 3; t.lastNag = 0; }
    save(); render();
  }

  function snoozeTask(id, minutes) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.due = new Date(Date.now() + minutes * 60000).toISOString();
    t.notified = false;
    save(); render();
  }

  document.getElementById('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var titleEl = document.getElementById('taskTitle');
    var title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    var date = document.getElementById('taskDate').value;
    var time = document.getElementById('taskTime').value;
    var due = null;
    if (date) due = new Date(date + 'T' + (time || '09:00')).toISOString();
    else if (time) {
      var d = new Date();
      var parts = time.split(':');
      d.setHours(+parts[0], +parts[1], 0, 0);
      if (d <= new Date()) d.setDate(d.getDate() + 1);
      due = d.toISOString();
    }
    tasks.push({
      id: uid(),
      title: title,
      due: due,
      repeat: document.getElementById('taskRepeat').value,
      strict: document.getElementById('taskStrict').value === 'strict',
      snoozesLeft: 3,
      done: false,
      notified: false
    });
    save();
    this.reset();
    render();
  });

  // ---------- Notifications ----------
  var notifyBar = document.getElementById('notifyBar');
  var banner = document.getElementById('banner');
  var bannerTimer = null;

  function updateNotifyBar() {
    var supported = 'Notification' in window;
    notifyBar.classList.toggle('hidden', !supported || Notification.permission === 'granted');
  }
  document.getElementById('notifyBtn').addEventListener('click', function () {
    Notification.requestPermission().then(function () { updateNotifyBar(); });
  });

  function showBanner(text) {
    banner.textContent = text;
    banner.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { banner.classList.remove('show'); }, 6000);
  }

  function beepAndBuzz() {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) { /* sound is best-effort */ }
  }

  function fireNotification(t) {
    var title = (t.strict ? '🚨 ' : '⏰ ') + t.title;
    var body = t.strict ? 'Do it now — this alarm will keep going.' : 'Due ' + friendlyWhen(t.due);
    if ('Notification' in window && Notification.permission === 'granted') {
      // Android Chrome only allows notifications through a service worker.
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(function (reg) {
          reg.showNotification(title, {
            body: body, tag: t.id, vibrate: [200, 100, 200],
            requireInteraction: !!t.strict, renotify: !!t.strict
          });
        }).catch(function () { tryDirect(title, body, t.id); });
      } else {
        tryDirect(title, body, t.id);
      }
    }
    if (!alarmTaskId && !document.hidden) {
      // The full-screen alarm has its own siren; don't double up.
      // And a hidden tab stays quiet — the notification itself is the alert.
      showBanner(title);
      beepAndBuzz();
    }
  }
  function tryDirect(title, body, tag) {
    try { new Notification(title, { body: body, tag: tag }); }
    catch (e) { /* in-page banner already shown */ }
  }

  var NAG_EVERY_MS = 60000;

  function checkDue() {
    var now = Date.now();
    var changed = false;
    tasks.forEach(function (t) {
      if (t.done || !t.due) return;
      if (new Date(t.due).getTime() > now) return;
      if (!t.notified) {
        t.notified = true;
        t.lastNag = now;
        changed = true;
        fireNotification(t);
      } else if (t.strict && now - (t.lastNag || 0) >= NAG_EVERY_MS) {
        // Strict tasks re-notify every minute until they're done.
        t.lastNag = now;
        changed = true;
        fireNotification(t);
      }
    });
    if (changed) { save(); render(); }
    ensureAlarm();
  }

  // ---------- Strict full-screen alarm ----------
  var alarmEl = document.getElementById('alarm');
  var alarmTaskId = null;
  var alarmBeepTimer = null;
  var alarmHoldTimer = null;
  var wakeLock = null;

  function ensureAlarm() {
    var now = Date.now();
    var due = tasks.filter(function (t) {
      return t.strict && !t.done && t.due && new Date(t.due).getTime() <= now;
    }).sort(function (a, b) { return new Date(a.due) - new Date(b.due); });
    if (!due.length) { hideAlarm(); return; }
    if (alarmTaskId === due[0].id) return;
    showAlarm(due[0]);
  }

  function showAlarm(t) {
    alarmTaskId = t.id;
    document.getElementById('alarmTitle').textContent = t.title;
    document.getElementById('alarmDue').textContent = 'Was due ' + friendlyWhen(t.due);
    updateSnoozeBtn(t);
    alarmEl.classList.add('show');
    clearInterval(alarmBeepTimer);
    // Siren only sounds while the app is actually on screen; a hidden
    // tab would otherwise beep invisibly in the background forever.
    alarmBeepTimer = setInterval(function () {
      if (!document.hidden) beepAndBuzz();
    }, 2500);
    if (!document.hidden) beepAndBuzz();
    if (navigator.wakeLock) {
      // Keep the screen on while the alarm is demanding attention.
      navigator.wakeLock.request('screen')
        .then(function (l) { wakeLock = l; })
        .catch(function () { /* best effort */ });
    }
  }

  function hideAlarm() {
    if (!alarmTaskId) return;
    alarmTaskId = null;
    alarmEl.classList.remove('show');
    clearInterval(alarmBeepTimer);
    resetHold();
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  function updateSnoozeBtn(t) {
    var btn = document.getElementById('alarmSnooze');
    var left = t.snoozesLeft == null ? 3 : t.snoozesLeft;
    btn.disabled = left <= 0;
    btn.textContent = left > 0 ? 'Snooze 5 minutes (' + left + ' left)' : 'No snoozes left';
  }

  var holdBtn = document.getElementById('alarmDone');
  var holdFill = document.getElementById('alarmFill');
  var HOLD_MS = 2000;

  function resetHold() {
    clearTimeout(alarmHoldTimer);
    alarmHoldTimer = null;
    holdFill.style.transition = 'none';
    holdFill.style.width = '0%';
  }
  holdBtn.addEventListener('pointerdown', function (e) {
    holdBtn.setPointerCapture(e.pointerId);
    holdFill.style.transition = 'width ' + HOLD_MS + 'ms linear';
    holdFill.style.width = '100%';
    alarmHoldTimer = setTimeout(function () {
      var id = alarmTaskId;
      hideAlarm();
      if (id) toggleDone(id);
      ensureAlarm(); // another strict task may be waiting behind this one
    }, HOLD_MS);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    holdBtn.addEventListener(ev, resetHold);
  });

  document.getElementById('alarmSnooze').addEventListener('click', function () {
    var t = tasks.find(function (x) { return x.id === alarmTaskId; });
    if (!t) { hideAlarm(); return; }
    var left = t.snoozesLeft == null ? 3 : t.snoozesLeft;
    if (left <= 0) return;
    t.snoozesLeft = left - 1;
    hideAlarm();
    snoozeTask(t.id, 5);
  });

  // ---------- Boot ----------
  document.getElementById('todayLine').textContent =
    new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

  updateNotifyBar();
  render();
  checkDue();
  setInterval(checkDue, 15000);
  setInterval(render, 60000); // keep "Today 3:00 PM" labels fresh
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { checkDue(); render(); }
  });

  // Offline install support: registers only where sw.js exists (the GitHub Pages copy).
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* not available here */ });
  }
})();
</script>
</body>
</html>
